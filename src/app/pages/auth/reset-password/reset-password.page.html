@if (!done()) {
<ion-header class="ion-no-border">
  <div class="auth-container">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/login" text=""></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </div>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-container">
    <div class="success-wrapper">
      <h1>Reset password</h1>
      <p class="subtitle">Enter your new password.</p>

      <form (ngSubmit)="reset()" novalidate>
        <ion-item class="form-field" lines="none">
          <ion-input
            label="New password"
            labelPlacement="stacked"
            placeholder="Enter new password"
            type="password"
            name="password"
            [(ngModel)]="password"
            helperText="Minimum 6 characters"
          ></ion-input>
        </ion-item>

        <ion-item class="form-field" lines="none">
          <ion-input
            label="Confirm new password"
            labelPlacement="stacked"
            placeholder="Confirm new password"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
          ></ion-input>
        </ion-item>

        @if (error()) {
        <ion-text color="danger"><p class="error">{{ error() }}</p></ion-text>
        }

        <ion-button
          expand="block"
          color="dark"
          class="full-width-btn"
          type="submit"
          [disabled]="loading()"
        >
          @if (loading()) { <ion-spinner name="dots"></ion-spinner> } @else {
          Reset password }
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
} @else {
<ion-content class="ion-padding">
  <div class="success-wrapper">
    <div class="check-circle">
      <ion-icon name="checkmark-outline"></ion-icon>
    </div>
    <h1>Password updated!</h1>
    <p class="subtitle">
      Demo reset complete. Any valid email and password of 6+ characters still
      work.
    </p>
    <ion-button
      expand="block"
      color="dark"
      class="full-width-btn"
      (click)="goLogin()"
      >Log in</ion-button
    >
    <button type="button" class="back-home" (click)="goHome()">
      Back to home
    </button>
  </div>
</ion-content>
}
