<ion-header class="ion-no-border">
  <div class="auth-container">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/login" text=""></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </div>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-container">
    <h1>Forgot password?</h1>
    <p class="subtitle">
      Enter your email to try the local password reset flow. No email is sent.
    </p>

    <form (ngSubmit)="send()" novalidate>
      <ion-item class="form-field" lines="none">
        <ion-input
          label="Email"
          labelPlacement="stacked"
          placeholder="Enter your email"
          type="email"
          name="email"
          [(ngModel)]="email"
        ></ion-input>
      </ion-item>

      @if (error()) {
      <ion-text color="danger"><p class="error">{{ error() }}</p></ion-text>
      } @if (sent()) {
      <ion-text color="success"
        ><p class="error">
          Email accepted. Opening the demo reset form…
        </p></ion-text
      >
      }

      <ion-button
        expand="block"
        color="dark"
        class="full-width-btn"
        type="submit"
        [disabled]="loading()"
      >
        @if (loading()) { <ion-spinner name="dots"></ion-spinner> } @else {
        Continue to reset }
      </ion-button>
    </form>

    <p class="footer-link">
      Remember your password? <a routerLink="/login">Log in</a>
    </p>
  </div>
</ion-content>
